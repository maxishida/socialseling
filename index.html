    <title>AI Digital Business</title>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=BBH+Sans+Bogle&display=swap');
    </style>
    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
                'deep-purple': '#1a0b2e',
                'neon-purple': '#764ba2',
                'glass-white': 'rgba(255, 255, 255, 0.1)',
                'glass-border': 'rgba(255, 255, 255, 0.2)',
            },
            fontFamily: {
              sans: ['Inter', 'system-ui', 'sans-serif'],
              bogle: ['"BBH Sans Bogle"', 'Inter', 'system-ui', 'sans-serif'],
            },
            backgroundImage: {
                'main-gradient': 'radial-gradient(circle at 10% 20%, rgb(69, 36, 122) 0%, rgb(28, 12, 56) 90%)',
                'glow-orb-1': 'radial-gradient(circle, rgba(139,92,246,0.4) 0%, rgba(139,92,246,0) 70%)',
                'glow-orb-2': 'radial-gradient(circle, rgba(236,72,153,0.3) 0%, rgba(236,72,153,0) 70%)',
            }
          }
        }
      }
    </script>
  <script type="importmap">
{

<link rel="stylesheet" href="/index.css">
<style>
  /* Hide scrollbar for Chrome, Safari and Opera */
  .no-scrollbar::-webkit-scrollbar {
      display: none;
  }
  /* Hide scrollbar for IE, Edge and Firefox */
  .no-scrollbar {
      -ms-overflow-style: none;  /* IE and Edge */
      scrollbar-width: none;  /* Firefox */
  }

  .glass-panel {
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(15px);
      -webkit-backdrop-filter: blur(15px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
  }
  
  .glass-card-overlay {
      background: linear-gradient(to top, rgba(0,0,0,0.9) 0%, rgba(0,0,0,0.6) 50%, rgba(0,0,0,0) 100%);
  }

  /* Ambient background glow effects */
  .orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(80px);
      z-index: 0;
      pointer-events: none;
  }
  
  .orb-1 { width: 500px; height: 500px; top: -10%; left: -100px; background: rgba(236, 72, 153, 0.4); }
  .orb-2 { width: 600px; height: 600px; bottom: 0%; right: -100px; background: rgba(147, 51, 234, 0.4); }
  .orb-3 { width: 400px; height: 400px; top: 40%; left: 30%; background: rgba(124, 58, 237, 0.15); }
</style>
</head>
